aid: govwell
name: GovWell
description: >-
  GovWell is a cloud-based AI operating system for modern local and county
  government, used by municipal and county agencies across 40+ U.S. states to
  digitize and automate civic services. The platform replaces paper and legacy
  systems with online workflows for permitting, licensing, planning and zoning,
  and code enforcement, and layers on AI capabilities including AutoCheck, which
  automatically reviews applications for errors and missing documentation before
  submission, and a 24/7 AI Community Assistant that answers resident questions.
  GovWell serves both government staff, who manage plan reviews, inspections,
  applications, payments, and renewals, and applicants and contractors, who
  submit and track requests through a self-service jurisdiction portal. The
  company is backed by Insight Partners and is an Esri partner. GovWell does not
  publish a public developer API, SDKs, or a .well-known discovery surface; this
  profile captures its identity and public trust/security posture.
